# Scenario-author request instead: role, requested_action, slug.
# To import an approved scenario, add scenario_source with test_case_path,
# how_to_run_path, and expectations_path pointing to the real supplied files.
# A verifier request also needs the assigned round_id and verification_slot: a or b.
# Keep peer verification records out of a blind verifier's required_inputs.
# For source/discovery roles, required_inputs may include {base: project, path: .}
